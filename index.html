<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d1117">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Nexus Mining Radar</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">

  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --input-bg: #21262d;
      --border: #30363d;
      --text: #c9d1d9;
      --text-bright: #f0f6fc;
      --blue: #58a6ff;
      --green: #3fb950;
      --orange: #f0883e;
      --gold: #d29922;
      --red: #f85149;
      --purple: #bc8cff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-size: 13px;
      padding: 10px;
      max-width: 440px;
      margin: 0 auto;
      min-height: 100vh;
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 10px;
    }
    .app-header h1 {
      font-size: 14px;
      font-weight: 700;
      color: var(--blue);
      letter-spacing: 0.3px;
    }
    .btn-gear {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
    }

    .label-tag {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      color: #8b949e;
      margin: 8px 0 4px 2px;
      letter-spacing: 0.5px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 5px;
    }
    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }

    button.tile {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 4px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: background 0.1s, border-color 0.1s;
    }
    button.tile.active {
      border-color: var(--blue);
      background: #1f2937;
      color: var(--text-bright);
      box-shadow: 0 0 0 1px var(--blue);
    }

    button.zone-tile.active[data-val="SENTINEL"] { border-color: var(--green); color: var(--green); background: #0c2d15; box-shadow: 0 0 0 1px var(--green); }
    button.zone-tile.active[data-val="OPEN"]     { border-color: var(--gold); color: var(--gold); background: #2f220d; box-shadow: 0 0 0 1px var(--gold); }
    button.zone-tile.active[data-val="DEAD"]     { border-color: var(--red); color: var(--red); background: #331316; box-shadow: 0 0 0 1px var(--red); }
    button.zone-tile.active[data-val="RIFT"]     { border-color: var(--purple); color: var(--purple); background: #28143d; box-shadow: 0 0 0 1px var(--purple); }

    .input-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .control-row label {
      font-size: 11px;
      font-weight: 600;
      color: #8b949e;
      min-width: 80px;
    }
    .control-row input, .control-row select {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-bright);
      font-size: 13px;
      font-weight: 600;
      padding: 5px 8px;
      outline: none;
    }

    .quick-bar {
      display: flex;
      gap: 4px;
    }
    .quick-btn {
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: #8b949e;
      border-radius: 3px;
      padding: 4px 6px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
    }
    .quick-btn:active {
      background: var(--border);
      color: var(--text-bright);
    }

    .output-card {
      margin-top: 10px;
      background: #01040
